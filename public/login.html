<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marathon Control · Sign in</title>
  <style>
    :root { --bg: #12131a; --card: #1c1e28; --line: #2c2f3d; --text: #e9eaf0; --muted: #9094a6; --accent: #ff4d6d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    label { display: block; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
    button { width: 100%; margin-top: 14px; background: var(--accent); border: 1px solid var(--accent); color: #fff; font: inherit; font-weight: 600;
      border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--accent); font-size: 12px; min-height: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <form id="form">
    <h1>⏱ Marathon Control</h1>
    <p data-i18n="login.title"></p>
    <label for="password" data-i18n="login.password"></label>
    <input type="password" id="password" autocomplete="current-password" required autofocus>
    <button id="submit" data-i18n="login.submit"></button>
    <div class="err" id="err"></div>
  </form>

  <script src="js/i18n.js"></script>
  <script>
    // Bahasa sama dengan pilihan di control panel (disimpan per browser).
    let lang = 'en';
    try {
      lang = localStorage.getItem('cpLanguage') || 'en';
    } catch {
      // localStorage tidak tersedia
    }
    I18n.setLang(lang);
    I18n.apply();

    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const err = document.getElementById('err');

    form.onsubmit = async (e) => {
      e.preventDefault();
      submit.disabled = true;
      err.textContent = '';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const json = await res.json();
        if (json.ok) {
          location.href = '/control.html';
          return;
        }
        err.textContent = json.error || I18n.t('login.failed');
      } catch {
        err.textContent = I18n.t('login.failed');
      }
      submit.disabled = false;
    };
  </script>
</body>
</html>
