<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marathon Control</title>
  <style>
    :root {
      --bg: #12131a; --card: #1c1e28; --line: #2c2f3d; --text: #e9eaf0; --muted: #9094a6;
      --accent: #ff4d6d; --ok: #3ccf8e; --warn: #ffb547;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    #conn { font-size: 12px; color: var(--muted); }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 16px 24px 40px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
    .big { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    button { background: #2a2d3b; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { color: var(--accent); }
    input, select { background: #12131a; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; min-width: 0; }
    input[type=number] { width: 90px; }
    input[type=checkbox] { width: auto; }
    label { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 4px; text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    td input { width: 100%; }
    .muted { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #2a2d3b; }
    .pill.ok { background: rgba(60, 207, 142, .15); color: var(--ok); }
    .pill.bad { background: rgba(255, 77, 109, .15); color: var(--accent); }
    .err { color: var(--accent); font-size: 12px; white-space: pre-wrap; }
    .log { max-height: 320px; overflow: auto; font-size: 13px; }
    .log div { padding: 5px 0; border-bottom: 1px solid var(--line); }
    .links code { display: block; background: #12131a; padding: 6px 8px; border-radius: 6px; margin: 4px 0 10px; user-select: all; overflow-wrap: anywhere; }
    .bar { height: 10px; border-radius: 999px; background: #2a2d3b; overflow: hidden; }
    .bar div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warn)); width: 0; transition: width .5s; }
  </style>
</head>
<body>
  <header>
    <h1>⏱ Marathon Control</h1>
    <span id="conn" class="pill bad" data-i18n="cp.disconnected"></span>
    <select id="uiLang" style="margin-left:auto" aria-label="Language">
      <option value="id">Bahasa Indonesia</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <section>
      <h2 data-i18n="cp.timer"></h2>
      <div class="big" id="timer">00:00:00</div>
      <div class="muted" id="timerStatus"></div>
      <div class="row">
        <button class="primary" id="btnStart" data-i18n="cp.start"></button>
        <button id="btnPause" data-i18n="cp.pause"></button>
        <button class="danger" id="btnReset" data-i18n="cp.resetTimer"></button>
      </div>
      <div class="row">
        <button data-add="-300">−5m</button>
        <button data-add="-60">−1m</button>
        <button data-add="60">+1m</button>
        <button data-add="300">+5m</button>
        <button data-add="3600">+1h</button>
      </div>
      <div class="row">
        <label><span data-i18n="cp.hours"></span> <input type="number" id="setH" min="0" value="1"></label>
        <label><span data-i18n="cp.minutes"></span> <input type="number" id="setM" min="0" max="59" value="0"></label>
        <button id="btnSet" data-i18n="cp.setTime"></button>
        <button id="btnAddCustom" data-i18n="cp.add"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="cp.members"></h2>
      <div class="big" id="count">0</div>
      <div class="muted" id="msText"></div>
      <div class="bar" style="margin:8px 0"><div id="msBar"></div></div>
      <div class="row">
        <button data-count="-1">−1</button>
        <button data-count="1">+1</button>
        <input type="number" id="setCount" min="0" value="0">
        <button id="btnSetCount" data-i18n="cp.setCount"></button>
      </div>
      <div class="row">
        <button class="danger" id="btnResetAll" data-i18n="cp.resetAll"></button>
      </div>
    </section>

    <section>
      <h2>YouTube</h2>
      <div class="row">
        <label><span data-i18n="cp.source"></span>
          <select id="ytSource">
            <option value="scraper" data-i18n="cp.sourceScraper"></option>
            <option value="api" data-i18n="cp.sourceApi"></option>
          </select>
        </label>
      </div>
      <div class="row"><span data-i18n="cp.status"></span> <span id="ytPill" class="pill">-</span></div>
      <div class="muted" id="ytInfo"></div>
      <div class="err" id="ytErr"></div>
      <div class="row" id="apiRow">
        <a href="/auth"><button id="btnLogin" data-i18n="cp.loginYt"></button></a>
        <button class="danger" id="btnLogout" data-i18n="cp.logout"></button>
      </div>
      <div class="row">
        <input id="videoId" data-i18n-placeholder="cp.videoPlaceholder" style="flex:1">
        <button class="primary" id="btnConnect" data-i18n="cp.connect"></button>
        <button id="btnDisconnect" data-i18n="cp.disconnect"></button>
      </div>
      <div class="muted" id="ytHint"></div>
    </section>

    <section>
      <h2 data-i18n="cp.simulate"></h2>
      <div class="row">
        <select id="simKind">
          <option value="new" data-i18n="cp.simNew"></option>
          <option value="gift" data-i18n="cp.simGift"></option>
          <option value="upgrade" data-i18n="cp.simUpgrade"></option>
          <option value="milestone" data-i18n="cp.simMilestone"></option>
        </select>
        <select id="simTier"></select>
      </div>
      <div class="row">
        <input id="simAuthor" data-i18n-placeholder="cp.simName" value="Test Viewer" style="flex:1">
        <label><span data-i18n="cp.simCount"></span> <input type="number" id="simCount" min="1" value="5"></label>
      </div>
      <div class="row"><button class="primary" id="btnSim" data-i18n="cp.simSend"></button></div>
    </section>

    <section style="grid-column: 1 / -1">
      <h2 data-i18n="cp.settings"></h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px">
        <div>
          <strong data-i18n="cp.tiers"></strong>
          <div class="muted" data-i18n="cp.tiersHint"></div>
          <table>
            <thead><tr><th data-i18n="cp.tierName"></th><th data-i18n="cp.minutes"></th><th data-i18n="cp.seconds"></th><th></th></tr></thead>
            <tbody id="tierRows"></tbody>
          </table>
          <button id="btnAddTier">+ Tier</button>
        </div>
        <div>
          <strong data-i18n="cp.milestones"></strong>
          <table>
            <thead><tr><th data-i18n="cp.msTarget"></th><th data-i18n="cp.msLabel"></th><th data-i18n="cp.msBonus"></th><th></th></tr></thead>
            <tbody id="msRows"></tbody>
          </table>
          <button id="btnAddMs">+ Milestone</button>
        </div>
        <div>
          <strong data-i18n="cp.other"></strong>
          <div class="row">
            <label><span data-i18n="cp.overlayLang"></span>
              <select id="cfgLanguage">
                <option value="en">English</option>
                <option value="id">Bahasa Indonesia</option>
              </select>
            </label>
          </div>
          <div class="row"><label><span data-i18n="cp.title"></span> <input id="cfgTitle" placeholder="MARATHON"></label></div>
          <div class="row"><label><span data-i18n="cp.channel"></span> <input id="cfgChannel" placeholder="@channel"></label></div>
          <div class="row"><label><span data-i18n="cp.giftTier"></span> <select id="cfgGiftTier"></select></label></div>
          <div class="row"><label><span data-i18n="cp.defaultSeconds"></span> <input type="number" id="cfgDefault" min="0"></label></div>
          <div class="row"><label><input type="checkbox" id="cfgUpgrades"> <span data-i18n="cp.countUpgrades"></span></label></div>
          <div class="row"><label><span data-i18n="cp.milestoneChat"></span> <input type="number" id="cfgMilestoneChat" min="0"></label></div>
          <div class="row"><label><span data-i18n="cp.maxDuration"></span> <input type="number" id="cfgMax" min="0"></label></div>
          <div class="row"><label><span data-i18n="cp.pollInterval"></span> <input type="number" id="cfgPoll" min="5"></label></div>
          <div class="muted" id="quotaInfo"></div>
        </div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="primary" id="btnSave" data-i18n="cp.save"></button>
        <span class="muted" id="saveMsg"></span>
      </div>
    </section>

    <section>
      <h2 data-i18n="cp.log"></h2>
      <div class="log" id="log"></div>
    </section>

    <section class="links">
      <h2 data-i18n="cp.obsUrls"></h2>
      <div class="muted" data-i18n="cp.urlTimer"></div>
      <code id="urlTimer"></code>
      <div class="muted" data-i18n="cp.urlMs"></div>
      <code id="urlMs"></code>
      <div class="muted" data-i18n="cp.urlOptions"></div>
    </section>
  </main>

  <script src="js/ws-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const t = I18n.t;
    let current = null;
    let cfg = null;
    let lastYoutube = null;

    // Bahasa control panel disimpan per browser; terpisah dari bahasa overlay (Pengaturan).
    function readUiLang() {
      try {
        return localStorage.getItem('cpLang') || 'id';
      } catch {
        return 'id';
      }
    }

    function setUiLang(lang) {
      $('uiLang').value = I18n.setLang(lang);
      try {
        localStorage.setItem('cpLang', I18n.lang);
      } catch {
        // localStorage tidak tersedia: bahasa tetap berlaku sampai halaman ditutup
      }
      I18n.apply();
      if (current) renderState(current);
      if (lastYoutube) renderYoutube(lastYoutube);
    }

    $('uiLang').onchange = () => setUiLang($('uiLang').value);

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const json = await res.json();
      if (!json.ok) alert(json.error);
      return json;
    }

    // --- Timer ---
    $('btnStart').onclick = () => api('/api/timer/start');
    $('btnPause').onclick = () => api('/api/timer/pause');
    $('btnReset').onclick = () => confirm(t('cp.confirmResetTimer')) && api('/api/timer/reset');
    document.querySelectorAll('[data-add]').forEach((b) => {
      b.onclick = () => api('/api/timer/add', { seconds: Number(b.dataset.add) });
    });
    const customSeconds = () => (Number($('setH').value) || 0) * 3600 + (Number($('setM').value) || 0) * 60;
    $('btnSet').onclick = () => api('/api/timer/set', { seconds: customSeconds() });
    $('btnAddCustom').onclick = () => api('/api/timer/add', { seconds: customSeconds() });

    function tick() {
      if (current) {
        const ms = Marathon.remainingMs(current);
        $('timer').textContent = Marathon.formatTime(ms);
        $('timerStatus').textContent = ms <= 0 ? t('cp.timerEmpty') : current.running ? t('cp.running') : t('cp.pausedStatus');
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // --- Member ---
    document.querySelectorAll('[data-count]').forEach((b) => {
      b.onclick = () => api('/api/count', { delta: Number(b.dataset.count) });
    });
    $('btnSetCount').onclick = () => api('/api/count', { set: Number($('setCount').value) });
    $('btnResetAll').onclick = () =>
      confirm(t('cp.confirmResetAll')) && api('/api/reset-all');

    // --- YouTube ---
    $('btnConnect').onclick = () => api('/api/youtube/connect', { videoId: $('videoId').value });
    $('btnDisconnect').onclick = () => api('/api/youtube/disconnect');
    $('btnLogout').onclick = () => confirm(t('cp.confirmLogout')) && api('/api/youtube/logout');

    // Ganti sumber langsung menyimpan config (field lain tetap dari config terakhir).
    $('ytSource').onchange = () => api('/api/config', { ...cfg, source: $('ytSource').value });

    function renderYoutube(y) {
      lastYoutube = y;
      const pill = $('ytPill');
      const isApi = y.source === 'api';
      $('ytSource').value = y.source;
      $('apiRow').hidden = !isApi;
      $('quotaInfo').hidden = !isApi;
      $('ytHint').textContent = t(isApi ? 'cp.hintApi' : 'cp.hintScraper');

      const lastCheck = y.lastPollAt ? t('cp.lastCheck', { time: new Date(y.lastPollAt).toLocaleTimeString() }) : null;

      if (!isApi) {
        pill.textContent = t(y.connected ? 'cp.ytConnected' : 'cp.ytNotConnected');
        pill.className = y.connected ? 'pill ok' : 'pill';
        const info = [];
        if (y.title) info.push(`Live: ${y.title}`);
        if (y.videoId) info.push(`Video: ${y.videoId}`);
        if (lastCheck) info.push(lastCheck);
        $('ytInfo').textContent = info.join(' · ');
        $('ytErr').textContent = y.lastError || '';
        return;
      }

      if (!y.hasCredentials) {
        pill.textContent = t('cp.ytNoCreds');
        pill.className = 'pill bad';
      } else if (!y.authorized) {
        pill.textContent = t('cp.ytNotLoggedIn');
        pill.className = 'pill bad';
      } else if (y.connected) {
        pill.textContent = t('cp.ytConnected');
        pill.className = 'pill ok';
      } else {
        pill.textContent = t('cp.ytLoggedIn');
        pill.className = 'pill';
      }
      const info = [];
      if (y.title) info.push(`Live: ${y.title}`);
      if (lastCheck) info.push(lastCheck);
      info.push(t('cp.quotaToday', { units: y.unitsToday }));
      $('ytInfo').textContent = info.join(' · ');
      $('ytErr').textContent = y.lastError || '';
      $('quotaInfo').textContent = t('cp.quotaInfo', { perHour: y.unitsPerHour, hours: y.hoursUntilDefaultQuota });
    }

    // --- Simulasi ---
    $('btnSim').onclick = () =>
      api('/api/simulate', {
        kind: $('simKind').value,
        tier: $('simTier').value,
        author: $('simAuthor').value,
        count: Number($('simCount').value),
      });

    // --- Pengaturan ---
    function tierRow(t = { name: '', seconds: 300 }) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input class="t-name"></td><td><input type="number" class="t-min" min="0"></td>
        <td><input type="number" class="t-sec" min="0" max="59"></td><td><button class="danger">✕</button></td>`;
      tr.querySelector('.t-name').value = t.name;
      tr.querySelector('.t-min').value = Math.floor(t.seconds / 60);
      tr.querySelector('.t-sec').value = t.seconds % 60;
      tr.querySelector('button').onclick = () => tr.remove();
      return tr;
    }

    function msRow(m = { target: '', label: '', bonusMinutes: 0 }) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="number" class="m-target" min="1"></td><td><input class="m-label"></td>
        <td><input type="number" class="m-bonus" min="0"></td><td><button class="danger">✕</button></td>`;
      tr.querySelector('.m-target').value = m.target;
      tr.querySelector('.m-label').value = m.label;
      tr.querySelector('.m-bonus').value = m.bonusMinutes || 0;
      tr.querySelector('button').onclick = () => tr.remove();
      return tr;
    }

    $('btnAddTier').onclick = () => $('tierRows').append(tierRow());
    $('btnAddMs').onclick = () => $('msRows').append(msRow());

    function renderConfig(c) {
      cfg = c;
      $('tierRows').replaceChildren(...c.tiers.map(tierRow));
      $('msRows').replaceChildren(...c.milestones.map(msRow));
      $('cfgLanguage').value = c.language;
      $('cfgTitle').value = c.title;
      $('cfgChannel').value = c.channel;
      const firstTier = new Option(t('cp.firstTier'), '');
      firstTier.dataset.i18n = 'cp.firstTier';
      $('cfgGiftTier').replaceChildren(firstTier, ...c.tiers.map((tier) => new Option(tier.name, tier.name)));
      $('cfgGiftTier').value = c.giftTier;
      $('cfgDefault').value = c.defaultSeconds;
      $('cfgUpgrades').checked = c.countUpgrades;
      $('cfgMilestoneChat').value = c.milestoneChatSeconds;
      $('cfgMax').value = Math.round(c.maxDurationSec / 60);
      $('cfgPoll').value = c.pollIntervalSec;

      const sel = $('simTier');
      const prev = sel.value;
      sel.replaceChildren(...c.tiers.map((tier) => new Option(`${tier.name} (${Marathon.formatAdded(tier.seconds)})`, tier.name)));
      const unknown = new Option(t('cp.unknownTier'), 'Tier Lain');
      unknown.dataset.i18n = 'cp.unknownTier';
      sel.append(unknown);
      if (prev) sel.value = prev;
    }

    $('btnSave').onclick = async () => {
      const tiers = [...$('tierRows').children].map((tr) => ({
        name: tr.querySelector('.t-name').value,
        seconds: (Number(tr.querySelector('.t-min').value) || 0) * 60 + (Number(tr.querySelector('.t-sec').value) || 0),
      }));
      const milestones = [...$('msRows').children].map((tr) => ({
        target: Number(tr.querySelector('.m-target').value),
        label: tr.querySelector('.m-label').value,
        bonusMinutes: Number(tr.querySelector('.m-bonus').value) || 0,
      }));
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: $('cfgTitle').value,
          language: $('cfgLanguage').value,
          source: cfg.source,
          channel: $('cfgChannel').value,
          giftTier: $('cfgGiftTier').value,
          tiers,
          milestones,
          defaultSeconds: Number($('cfgDefault').value),
          countUpgrades: $('cfgUpgrades').checked,
          milestoneChatSeconds: Number($('cfgMilestoneChat').value),
          maxDurationSec: (Number($('cfgMax').value) || 0) * 60,
          pollIntervalSec: Number($('cfgPoll').value),
        }),
      }).then((r) => r.json());
      $('saveMsg').textContent = res.ok ? t('cp.saved', { time: new Date().toLocaleTimeString() }) : res.error;
    };

    // --- Render state ---
    function renderState(s) {
      current = s;
      $('count').textContent = s.memberCount;
      const m = s.milestones;
      $('msText').textContent = m.next
        ? t('cp.msNext', {
          count: s.memberCount,
          target: m.next.target,
          label: m.next.label || t('cp.msNextFallback'),
          reached: m.reachedCount,
          total: m.list.length,
        })
        : t(m.allDone ? 'cp.msAllDone' : 'cp.msNone');
      $('msBar').style.width = `${m.progress * 100}%`;

      $('log').replaceChildren(
        ...s.history.map((h) => {
          const div = document.createElement('div');
          const count = h.kind === 'gift' ? ` ×${h.count}` : '';
          div.textContent =
            `${new Date(h.at).toLocaleTimeString()} · ${h.author} · ${t(`cp.kind.${h.kind}`)}${count}` +
            `${h.tier ? ` (${h.tier})` : ''} · ${h.seconds ? Marathon.formatAdded(h.seconds) : '+0'}` +
            `${h.simulated ? ` · ${t('cp.test')}` : ''}`;
          return div;
        })
      );
      if (!s.history.length) $('log').textContent = t('cp.noEvents');
    }

    setUiLang(readUiLang());
    $('urlTimer').textContent = `${location.origin}/overlay-timer.html`;
    $('urlMs').textContent = `${location.origin}/overlay-milestone.html`;

    Marathon.connect({
      open() {
        $('conn').dataset.i18n = 'cp.connected';
        $('conn').textContent = t('cp.connected');
        $('conn').className = 'pill ok';
      },
      close() {
        $('conn').dataset.i18n = 'cp.disconnected';
        $('conn').textContent = t('cp.disconnected');
        $('conn').className = 'pill bad';
      },
      state: renderState,
      config: renderConfig,
      youtube: renderYoutube,
    });
  </script>
</body>
</html>
